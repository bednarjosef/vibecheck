name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # skips quietly until the NPM_TOKEN repo secret is configured
      - if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # electron lives in "dependencies" for the npm-global install story,
      # but electron-builder insists on devDependencies — shuffle it over
      - run: npm pkg delete dependencies.electron
      - run: npm pkg set devDependencies.electron="^31.0.0"
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
