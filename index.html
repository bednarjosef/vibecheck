<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --ok: #3ecf8e;
    --minor: #f5c542;
    --major: #f08a3c;
    --critical: #f0554d;
    --unknown: #8b93a1;
    --ink: #e8ebef;
    --dim: #9aa2ad;

    /* the usage ramp — one source of truth for the meters and for the
       headline a milestone announcement borrows */
    --tone-flat: #949cab;
    --tone-warm: #d8a13c;
    --tone-hot: #e0674f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* pieces of the pill come and go with [hidden], and several of them set
     an explicit display — which would otherwise out-specify the UA rule */
  [hidden] { display: none !important; }

  /* Bundled, not requested: a named font nobody has is how the pill ended
     up wearing whatever each machine's default monospace happened to be.
     JetBrains Mono ships with the app (SIL OFL 1.1, see fonts/OFL.txt), so
     it looks the same everywhere — and it was drawn for exactly this size. */
  @font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 400;
    font-display: block;
    src: url('fonts/jetbrains-mono-400.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 600;
    font-display: block;
    src: url('fonts/jetbrains-mono-600.woff2') format('woff2');
  }

  html, body {
    background: transparent;
    overflow: hidden;
    font-family: 'JetBrains Mono', ui-monospace, "SF Mono", "Cascadia Mono", "DejaVu Sans Mono", monospace;
    height: 100%;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  /* Everything vertical is written in terms of --dir: +1 hangs from the
     top edge, -1 stands on the bottom one. The pill arrives from off-screen
     on its own side, and the lamp always faces away from the screen edge. */
  @property --dir { syntax: '<number>'; initial-value: 1; inherits: true; }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 30px; /* room for the glow to fade before the window edge */
  }

  body.bottom {
    --dir: -1;
    align-items: flex-end;
    padding-top: 0;
    padding-bottom: 30px;
  }

  #panel {
    display: inline-flex;
    flex-direction: column;
    gap: 9px;
    padding: 13px 20px 13px 17px;
    border-radius: 16px;
    background: rgba(15, 17, 21, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);

    opacity: 0;
    transform: translateY(calc(var(--dir) * -14px));
    /* exit: quicker than entry — it should snap away */
    transition:
      opacity 110ms cubic-bezier(0.3, 0, 0.2, 1),
      transform 110ms cubic-bezier(0.3, 0, 0.2, 1);
  }

  body.bottom #panel { box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.35); }

  #panel.on {
    opacity: 1;
    transform: translateY(0);
    /* springy arrival: drops in, overshoots a touch, settles */
    animation: panel-in 340ms cubic-bezier(0.34, 1.4, 0.64, 1) both;
  }

  @keyframes panel-in {
    from { opacity: 0; transform: translateY(calc(var(--dir) * -30px)) scale(0.955); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* departure with anticipation: a tiny crouch, then launch away */
  #panel.out {
    animation: panel-out 250ms both;
  }

  /* once it's gone it's really gone — an invisible-but-painted panel keeps
     the window's layer tree alive for nothing */
  #panel:not(.on):not(.out) { visibility: hidden; }

  @keyframes panel-out {
    0%   { opacity: 1; transform: translateY(0) scale(1); animation-timing-function: ease-out; }
    24%  { opacity: 1; transform: translateY(calc(var(--dir) * 3.5px)) scale(1.012); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0.6); }
    100% { opacity: 0; transform: translateY(calc(var(--dir) * -32px)) scale(0.94); }
  }

  /* ── the underglow ────────────────────────────────────────────────
     A small lamp on the bottom edge that wanders, breathes, and casts a
     tight cone of light downward, in whatever color the status is. */
  @property --trace { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @property --erase { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

  /* the lamp: a half-lens fused to the border line — flat side welded to the
     edge, thickest at center, its outer side tapering away to nothing */
  #panel::before {
    content: '';
    position: absolute;
    top: 100%; /* overlays the 1px border row: no seam, no gap */
    left: 50%;
    width: 150px;
    height: 3.5px;
    margin-left: -75px;
    transform-origin: 50% 0;
    opacity: 0;
    transition: opacity 220ms ease;
    pointer-events: none;
    background: radial-gradient(
      50% 100% at 50% 0%,
      color-mix(in srgb, var(--status-color, var(--unknown)) 95%, transparent) 0%,
      color-mix(in srgb, var(--status-color, var(--unknown)) 60%, transparent) 48%,
      transparent 82%
    );
  }

  /* standing on the bottom edge, the lamp moves to the pill's top */
  body.bottom #panel::before {
    top: auto;
    bottom: 100%;
    transform-origin: 50% 100%;
    background: radial-gradient(
      50% 100% at 50% 100%,
      color-mix(in srgb, var(--status-color, var(--unknown)) 95%, transparent) 0%,
      color-mix(in srgb, var(--status-color, var(--unknown)) 60%, transparent) 48%,
      transparent 82%
    );
  }

  /* ignition: two beams leave the far edge's center in opposite directions,
     trace around the OUTSIDE of the border, meet where the lamp will sit —
     then the ring erases along the same path. Thickness matches the lamp. */
  #panel::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 17px;
    padding: 1px;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 220ms ease;
    pointer-events: none;
    /* visible band on each side: from the erase front to the draw front —
       the ring is drawn tip-first from the far edge, then erased the same
       way. 0deg is up, so flipping the pill spins the whole pattern 180°. */
    background: conic-gradient(
      from calc((1 - var(--dir)) * 90deg),
      transparent 0deg,
      transparent var(--erase),
      color-mix(in srgb, var(--status-color, var(--unknown)) 58%, transparent) var(--erase),
      color-mix(in srgb, var(--status-color, var(--unknown)) 58%, transparent) var(--trace),
      transparent var(--trace),
      transparent calc(360deg - var(--trace)),
      color-mix(in srgb, var(--status-color, var(--unknown)) 58%, transparent) calc(360deg - var(--trace)),
      color-mix(in srgb, var(--status-color, var(--unknown)) 58%, transparent) calc(360deg - var(--erase)),
      transparent calc(360deg - var(--erase)),
      transparent 360deg
    );
  }

  #panel.on::after {
    animation: ring-intro 1000ms linear both;
  }

  /* draw the full ring, retract until only the arc the lamp will occupy
     remains (±72° ≈ the lens's 150px at this pill height), then
     that remnant melts in place as the lens blooms under it.
     The erase decelerates: angle→perimeter mapping is very nonlinear on a
     wide flat pill, so constant angular speed would visually accelerate
     and stutter across the last stretch of the bottom edge. */
  @keyframes ring-intro {
    0%   { --trace: 0deg;   --erase: 0deg;   opacity: 1; animation-timing-function: linear; }
    46%  { --trace: 180deg; --erase: 0deg;   opacity: 1; animation-timing-function: ease-in; }
    60%  { --trace: 180deg; --erase: 62deg;  opacity: 1; animation-timing-function: ease-out; }
    81%  { --trace: 180deg; --erase: 112deg; opacity: 1; animation-timing-function: ease-out; }
    100% { --trace: 180deg; --erase: 126deg; opacity: 0; }
  }

  #panel.on::before {
    opacity: 1;
    animation:
      lamp-stretch 7.1s ease-in-out 700ms infinite,
      lamp-breathe 5.3s ease-in-out 700ms infinite,
      lamp-in 300ms ease 700ms both;
  }

  /* fades the lens in right as the traced ring dissolves */
  @keyframes lamp-in {
    from { opacity: 0; }
    to   { opacity: 0.65; }
  }

  /* anchored center; gently widens and narrows from its ends */
  @keyframes lamp-stretch {
    0%   { transform: scaleX(0.72); }
    35%  { transform: scaleX(1.12); }
    58%  { transform: scaleX(0.88); }
    82%  { transform: scaleX(1.04); }
    100% { transform: scaleX(0.72); }
  }

  @keyframes lamp-breathe {
    0%, 100% { opacity: 0.65; }
    42%      { opacity: 1; }
    70%      { opacity: 0.8; }
  }

  @media (prefers-reduced-motion: reduce) {
    #panel { transition: opacity 120ms linear; transform: none; }
    #panel.on { animation: none; }
    #panel.out { animation: none; }
    #panel.on::before { animation: none; opacity: 0.8; }
    #panel.on::after { animation: none; opacity: 0; }
  }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* the headline sits over a table it's narrower than — centring it is what
     makes that a title rather than a line that failed to reach the edge */
  #head { justify-content: center; }
  #panel.wide #head { justify-content: flex-start; }

  /* the Claude spark — static, just a soft breathing pulse. Only while the
     pill is up: an animation on a hidden element still drives the
     compositor at 60fps, which is most of a background app's cost. */
  #spark {
    flex: none;
    width: 17px; height: 17px;
    color: #d97757;
  }

  #panel.on #spark { animation: breathe 2.6s ease-in-out infinite; }

  #spark svg { display: block; width: 100%; height: 100%; }

  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.8; }
  }

  @media (prefers-reduced-motion: reduce) {
    #panel.on #spark { animation: none; }
  }

  /* the phrase is a sentence, so it's set like one — uppercase turned every
     phrasing into the same shape and threw away the wording's tone */
  #word {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.005em;
    color: var(--status-color, var(--unknown));
    white-space: nowrap;
  }

  /* incident title (or affected components), inline — Anthropic writes these
     as sentences too, so shouting them was ours to stop */
  #affected {
    display: none;
    font-size: 12.5px;
    letter-spacing: 0.01em;
    color: var(--dim);
    white-space: nowrap;
    max-width: 420px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #affected.has { display: inline; }

  /* ── Claude Code usage ────────────────────────────────────────────
     One grid, one row per window, every row the same shape: how full it
     is, the figure, the local tally, how long it has left. Columns take
     exactly the width of their widest cell, so the card can't be narrower
     without breaking alignment — and the last one takes the slack, so a
     long incident title pulls the times out to the right edge instead of
     leaving a hole under it. Nothing here appears or disappears. */
  #usage {
    display: none;
    grid-template-columns: auto auto auto 1fr;
    align-items: center;
    column-gap: 11px;
    row-gap: 6px;
    white-space: nowrap;
  }

  #usage.has { display: grid; }

  /* no local tally beside the percentages */
  #usage.notoks { grid-template-columns: auto auto 1fr; }

  /* token counts have no denominator, so there's no bar to draw — and the
     count is already the figure, so no second column either */
  #usage.nobars.notoks { grid-template-columns: auto 1fr; }

  /* the row and the meter are groupings for the markup's sake — the grid
     needs to see the cells themselves */
  .grp, .m { display: contents; }

  /* One quiet tier, not two nearly-alike ones. The tally and the clock are
     separated by where they sit — tight to the figure vs out at the right
     edge — so they don't also need to differ in weight. */
  .tok, .when {
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--dim);
    opacity: 0.5;
    font-variant-numeric: tabular-nums;
  }

  /* Usage runs on its own ramp: the status colors belong to Claude's health,
     and borrowing them would weld two unrelated facts together. The neutral
     is bright enough that the bar and its figure read as one object at every
     value — before, they only matched once the number went amber. */
  .m { --tone: var(--tone-flat); }
  .m.warm { --tone: var(--tone-warm); }
  .m.hot  { --tone: var(--tone-hot); }

  /* 4ch is exactly "100%" — the widest this can ever be, so the column is
     as narrow as it can get and still never jump */
  .m .n {
    min-width: 4ch;
    text-align: right;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink);
    opacity: 0.8;
    font-variant-numeric: tabular-nums;
  }
  .m.warm .n,
  .m.hot .n { color: var(--tone); opacity: 1; }

  /* ten marks, lit left to right — a count rather than a length, and
     quantised to 10% so it never shimmers by a pixel as the number ticks */
  .m .ticks {
    position: relative;
    width: 40px; height: 9px;
    --pitch: repeating-linear-gradient(90deg, #000 0 3px, transparent 3px 4px);
  }
  .m .ticks::before,
  .m .ticks::after {
    content: '';
    position: absolute;
    inset: 0;
    mask-image: var(--pitch);
    -webkit-mask-image: var(--pitch);
  }
  .m .ticks::before { background: rgba(255, 255, 255, 0.12); }
  .m .ticks::after {
    background: var(--tone);
    width: calc(round(up, var(--p) * 0.4, 4) * 1px);
    transition: width 260ms cubic-bezier(0.2, 0.85, 0.25, 1);
  }

  /* how long this window has left — always there, never moves */
  .when {
    justify-self: end;
    min-width: 6ch;
  }
</style>
</head>
<body>
  <div id="panel">
    <div class="row" id="head">
      <span id="spark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></svg></span>
      <span id="word">Checking&hellip;</span>
      <span id="affected"></span>
    </div>
    <div id="usage"></div>
  </div>

<script>
  // The colour is what tells you the severity, so the words are free to be
  // flavour — but only where flavour belongs. Green gets to play; the worse
  // it gets, the plainer the phrasing, because a pill that jokes during an
  // outage is a pill you stop trusting. Kept short: the card sizes to them.
  const WORDS = {
    none: {
      color: 'var(--ok)',
      phrases: [
        'Claude is fine',
        'Vibe check passed',
        'All clear',
        'Running clean',
        'No notes',
        'Nothing to report',
        'Green across',
        'Purring along',
        'Claude is well',
        'Smooth sailing',
      ],
    },
    minor: {
      color: 'var(--minor)',
      phrases: ['Claude is wobbly', 'A little rough', 'Minor turbulence', 'Not quite right'],
    },
    major: {
      color: 'var(--major)',
      phrases: ['Claude is struggling', 'Things are rough', 'Badly degraded'],
    },
    critical: {
      color: 'var(--critical)',
      phrases: ['Claude is down', 'Everything is down', 'Total outage'],
    },
    unknown: {
      color: 'var(--unknown)',
      phrases: ['Can’t reach Claude', 'No signal', 'Status unknown'],
    },
  };

  // never the same phrase twice running, per severity
  const lastPick = {};

  function pickPhrase(indicator) {
    const list = (WORDS[indicator] || WORDS.unknown).phrases;
    if (list.length < 2) return list[0];
    let i;
    do { i = Math.floor(Math.random() * list.length); } while (i === lastPick[indicator]);
    lastPick[indicator] = i;
    return list[i];
  }

  // The phrase is rolled when the pill is summoned or the status changes —
  // never on a background re-render, so it can't shuffle while you're
  // holding the key and reading it.
  let phrase = null;
  let phraseFor = null;

  function phraseFrom(indicator, reroll) {
    if (reroll || phraseFor !== indicator || !phrase) {
      phrase = pickPhrase(indicator);
      phraseFor = indicator;
    }
    return phrase;
  }

  const panel = document.getElementById('panel');
  const headEl = document.getElementById('head');
  const wordEl = document.getElementById('word');
  const affectedEl = document.getElementById('affected');
  const usageEl = document.getElementById('usage');
  let usageData = null;
  let statusData = null;

  // tokens read well at three digits max: 812 → 45K → 1.2M → 38M. The tray
  // shows the same figures from usage.js — keep the two in step.
  const fmtTokens = (n) =>
    n >= 1e9
      ? (n >= 1e10 ? Math.round(n / 1e9) : parseFloat((n / 1e9).toFixed(1))) + 'B'
      : n >= 1e6
        ? (n >= 1e7 ? Math.round(n / 1e6) : parseFloat((n / 1e6).toFixed(1))) + 'M'
        : n >= 1000
          ? Math.round(n / 1000) + 'K'
          : String(n);

  // how long a window has left, in its two largest units: 23m · 2h 14m · 5d 5h
  function fmtLeft(until) {
    if (!until) return '';
    const mins = Math.round((until - Date.now()) / 60000);
    if (mins <= 0) return '';
    if (mins < 60) return mins + 'm';
    if (mins < 1440) return Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm';
    return Math.floor(mins / 1440) + 'd ' + Math.floor((mins % 1440) / 60) + 'h';
  }

  // one window: the real /usage percentage when the shim is feeding us,
  // the local token count when it isn't
  function readWindow(pctSrc, localSrc, whenIdle) {
    if (!pctSrc && !localSrc) return null;
    const pct = pctSrc ? pctSrc.pct : null;
    const resetAt = (pctSrc && pctSrc.resetAt) || (localSrc && localSrc.resetAt) || null;
    return {
      pct,
      label: pct !== null ? pct + '%' : fmtTokens(localSrc.tokens),
      // the local tally only earns a column when it isn't already the figure
      tokens: pct !== null && localSrc ? fmtTokens(localSrc.tokens) : null,
      tone: pct === null ? '' : pct >= 95 ? 'hot' : pct >= 80 ? 'warm' : '',
      when: fmtLeft(resetAt) || whenIdle,
    };
  }

  // Every row the same shape, so the eye reads down the columns: how full ·
  // the figure · this machine's tally · how long it has left. A bar is a
  // fraction of something, so token counts don't get one — and the empty
  // cell keeps the columns aligned when only one window has a percentage.
  const rowHTML = (r, bars, toks) =>
    `<span class="grp"><span class="m ${r.tone}" style="--p:${r.pct || 0}">` +
    (bars ? (r.pct === null ? '<span></span>' : '<span class="ticks"></span>') : '') +
    `<span class="n">${r.label}</span>` +
    (toks ? `<span class="tok">${r.tokens || ''}</span>` : '') +
    `</span><span class="when">${r.when}</span></span>`;

  function renderUsage() {
    if (!usageData) {
      usageEl.classList.remove('has');
      return;
    }
    const lim = usageData.limits || {};
    const rows = [
      readWindow(lim.session, usageData.session, 'idle'),
      readWindow(lim.week, usageData.week, 'rolling'),
    ].filter(Boolean);
    const bars = rows.some((r) => r.pct !== null);
    const toks = rows.some((r) => r.tokens);
    usageEl.innerHTML = rows.map((r) => rowHTML(r, bars, toks)).join('');
    usageEl.classList.toggle('nobars', !bars);
    usageEl.classList.toggle('notoks', !toks);
    usageEl.classList.toggle('has', rows.length > 0);
    balance();
  }

  // whichever part is wider sets the card's width; the narrower one centres
  // under it, unless that's the headline during an incident — then the
  // headline owns the width and the table reads as detail beneath it
  function balance() {
    panel.classList.toggle('wide', headEl.scrollWidth > usageEl.scrollWidth + 1);
  }

  // A milestone announcement, or the hello of a first launch: either way the
  // pill let itself in to say one thing, so it says only that — no phrase, no
  // incident title underneath it. Below 80% it's plain information and wears
  // the ink; past that it borrows the same ramp the meters use, so the
  // underglow is lit by the reason it appeared.
  const WINDOW_NAME = { session: 'Session', week: 'Week' };
  let notice = null;

  const noticeText = (n) =>
    n.text
      ? n.text
      : n.pct >= 100
        ? `${WINDOW_NAME[n.window]} limit reached`
        : `${WINDOW_NAME[n.window]} ${n.pct}% used`;

  const noticeTone = (n) =>
    n.pct >= 95 ? 'var(--tone-hot)' : n.pct >= 80 ? 'var(--tone-warm)' : 'var(--ink)';

  const BLANK = { indicator: 'unknown', components: [], incident: null };

  function render(data, reroll) {
    if (data) statusData = data;
    const d = statusData || BLANK;
    const s = WORDS[d.indicator] || WORDS.unknown;
    panel.style.setProperty('--status-color', notice ? noticeTone(notice) : s.color);
    wordEl.textContent = notice ? noticeText(notice) : phraseFrom(d.indicator, reroll);

    // the human-written incident title beats raw component states
    const bad = d.components.filter((c) => c.status !== 'operational');
    const extra = notice
      ? ''
      : d.incident && d.indicator !== 'none'
        ? d.incident.name
        : bad.map((c) => c.name.replace(/\s*\(.*?\)/, '')).join(' + ');
    affectedEl.textContent = extra;
    affectedEl.classList.toggle('has', !!extra);
    renderUsage();
  }

  // sound themes: each is a voice (partials, attack, optional pitch glide)
  // plus four gestures. Open goes up, close goes down; status changes get
  // slower two-note phrases (down = bad news, up = recovery).
  function chime(kind, theme = 'bells') {
    const ctx = new AudioContext();
    const t0 = ctx.currentTime;
    // one note of a voice; partial: [freq multiple, level, decay fraction]
    // — the decay fraction lets bright partials die before the fundamental,
    // which is what makes wood sound like wood
    const voice = (v) => (freq, at, vol, dur) => {
      for (const [mult, level, durScale = 1] of v.partials) {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = v.type || 'sine';
        o.frequency.value = freq * mult;
        g.gain.setValueAtTime(0, t0 + at);
        g.gain.linearRampToValueAtTime(vol * level, t0 + at + v.attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur * durScale);
        o.connect(g).connect(ctx.destination);
        o.start(t0 + at);
        o.stop(t0 + at + dur * durScale + 0.05);
      }
    };

    const bells = voice({ partials: [[1, 1], [2, 0.35], [2.99, 0.12]], attack: 0.025 });
    const pluck = voice({ partials: [[1, 1], [2, 0.5], [3, 0.15]], attack: 0.002 });
    const wood = voice({
      partials: [[1, 1], [3.9, 0.4, 0.32], [9.2, 0.12, 0.1]],
      attack: 0.0015,
    });
    // piano-ish: stretched harmonic stack (strings ring sharp), brighter
    // partials dying young, plus a detuned second "string" for the unison beat
    const piano = voice({
      partials: [
        [1, 0.9, 1],
        [1.0016, 0.35, 0.9],
        [2.001, 0.5, 0.55],
        [3.004, 0.28, 0.4],
        [4.008, 0.15, 0.3],
        [5.013, 0.08, 0.22],
      ],
      attack: 0.006,
    });

    const THEMES = {
      bells: {
        open:  () => { bells(659.26, 0, 0.04, 0.9); bells(987.77, 0.09, 0.045, 1.1); },
        close: () => { bells(987.77, 0, 0.035, 0.7); bells(659.26, 0.08, 0.04, 0.9); },
        good:  () => { bells(659.26, 0, 0.06, 1.1); bells(880, 0.16, 0.06, 1.4); },
        bad:   () => { bells(523.25, 0, 0.06, 1.1); bells(392, 0.16, 0.06, 1.4); },
      },
      // minecraft noteblock energy: instant pluck, quick clean decay
      pluck: {
        open:  () => { pluck(783.99, 0, 0.05, 0.45); pluck(1046.5, 0.075, 0.055, 0.5); },
        close: () => { pluck(1046.5, 0, 0.045, 0.4); pluck(783.99, 0.07, 0.05, 0.45); },
        good:  () => { pluck(783.99, 0, 0.06, 0.6); pluck(1174.7, 0.12, 0.06, 0.8); },
        bad:   () => { pluck(659.26, 0, 0.06, 0.6); pluck(493.88, 0.12, 0.06, 0.8); },
      },
      // xylophone-bar knock: dry, woody, brightness gone in a blink
      wood: {
        open:  () => { wood(523.25, 0, 0.06, 0.4); wood(783.99, 0.08, 0.065, 0.45); },
        close: () => { wood(783.99, 0, 0.055, 0.35); wood(523.25, 0.075, 0.06, 0.4); },
        good:  () => { wood(523.25, 0, 0.07, 0.5); wood(1046.5, 0.13, 0.065, 0.6); },
        bad:   () => { wood(440, 0, 0.07, 0.5); wood(329.63, 0.13, 0.07, 0.6); },
      },
      piano: {
        open:  () => { piano(440, 0, 0.05, 1.0); piano(659.26, 0.09, 0.055, 1.2); },
        close: () => { piano(659.26, 0, 0.045, 0.9); piano(440, 0.085, 0.05, 1.0); },
        good:  () => { piano(523.25, 0, 0.06, 1.3); piano(783.99, 0.15, 0.06, 1.6); },
        bad:   () => { piano(440, 0, 0.06, 1.3); piano(349.23, 0.15, 0.06, 1.6); },
      },
    };

    ((THEMES[theme] || THEMES.bells)[kind] || (() => {}))();
    setTimeout(() => ctx.close(), 3000);
  }

  // the countdown only has to be honest to the minute, and only while
  // anyone can see it
  let ticker = null;

  window.vibecheck.onStatus((data) => render(data));
  window.vibecheck.onReveal(() => {
    panel.classList.remove('out');
    panel.classList.add('on');
    render(null, true); // a fresh phrase each summoning
    renderUsage();
    clearInterval(ticker);
    ticker = setInterval(renderUsage, 20_000);
  });
  window.vibecheck.onConceal(() => {
    clearInterval(ticker);
    ticker = null;
    // the announcement is spent — but repainting now would swap the headline
    // back mid-exit, so the next reveal is what clears it off the card
    notice = null;
    if (!panel.classList.contains('on')) return;
    panel.classList.remove('on');
    panel.classList.add('out');
  });

  // when the exit finishes, drop the class so the panel reaches its idle
  // state and stops being painted at all
  panel.addEventListener('animationend', (e) => {
    if (e.animationName === 'panel-out') panel.classList.remove('out');
  });

  window.vibecheck.onChime(chime);
  window.vibecheck.onNotice((n) => {
    notice = n;
    render();
  });
  window.vibecheck.onUsage((d) => {
    usageData = d;
    renderUsage();
  });
  window.vibecheck.onPosition((pos) => {
    document.body.classList.toggle('bottom', pos === 'bottom');
  });
</script>
</body>
</html>
